# flatcar_large.cfg - Expanded 1988 MCM Problem B (runtime test instance)
#
# Format: key = value(s). Lists are space- or comma-separated.
# '#' starts a comment. Crate types are C1, C2, ... in list order.
#
# Changes from flatcar.cfg:
#   - 12 crate types instead of 7 (79 crates total instead of 48)
#   - Original C1-C4 kept as-is; original C5-C7 renumbered to C9-C11
#     so the special types stay at the END of the list
#   - New non-special types C5-C8, new special type C12
#   - Cars, capacities, and special limit unchanged
#
# Supply vs. capacity (2 cars = 20400 mm, 80 t):
#   total thickness = 42889 mm  (2.10x length capacity; original 1.35x)
#   total weight    = 149 t     (1.86x weight capacity; original 1.11x)
#   special supply  = 13067 mm  vs. 3027 mm limit (original 10120 mm)
#   avg density ~34.7 kg/cm vs. per-car 39.2 kg/cm, so packing the dense
#   crates (C2, C8, C9, C12) hits the 40 t cap before the length runs out.
 
# ---- Crates (one entry per crate type, C1..C12) ----
#              C1   C2   C3   C4   C5   C6   C7   C8   | C9   C10  C11  C12  (special)
thickness_mm = 487  520  613  720  554  678  705  442    487  520  640  589
weight_t     = 2    3    1    0.5  2.5  1.5  1.2  3.5    4    2    1    2.8
count        = 8    7    9    6    6    5    5    5      6    4    8    5
 
# ---- Flatcars (both identical) ----
car_length_mm = 10200    # 10.2 m of usable length
car_weight_t  = 40       # 40 metric tons
 
# ---- Special restriction ----
# The last special_count crate types (here C9, C10, C11, C12) may occupy
# at most special_limit_mm in total, across both cars.
special_count    = 4
special_limit_mm = 3027  # 302.7 cm
 

# flatcar.cfg - 1988 MCM Problem B: The Railroad Flatcar Problem
#
# Format: key = value(s). Lists are space- or comma-separated.
# '#' starts a comment. Crate types are C1, C2, ... in list order.
 
# ---- Crates (one entry per crate type, C1..C7) ----
thickness_mm = 487  520  613  720  487  520  640 
weight_t     = 2    3    1    0.5  4    2    1
count        = 8    7    9    6    6    4    8
 
# ---- Flatcars (both identical) ----
car_length_mm = 10200    # 10.2 m of usable length
car_weight_t  = 40       # 40 metric tons
 
# ---- Special restriction ----
# The last special_count crate types (here C5, C6, C7) may occupy
# at most special_limit_mm in total, across both cars.
special_count    = 3
special_limit_mm = 3027  # 302.7 cm
